name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Gradle project
        shell: bash
        run: |
          echo "Searching for gradlew..."
          find . -name "gradlew" -type f -not -path "./.git/*"

      - name: Build Debug APK
        shell: bash
        run: |
          GRADLEW=$(find . -name "gradlew" -type f -not -path "./.git/*" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo "Repository structure:"
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi

          echo "Found Gradle wrapper: $GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/**/*.apk"
