name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - - name: Setup Node.js
  uses: actions/setup-node@v4
  with:
    node-version: '20'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Show Android build script
        run: |
          echo "===== package.json ====="
          cat package.json
          echo "===== build-android.sh ====="
          if [ -f scripts/build-android.sh ]; then
            cat scripts/build-android.sh
          else
            echo "scripts/build-android.sh not found"
          fi

      - name: Build Android project
        run: |
          chmod +x scripts/build-android.sh
          bash scripts/build-android.sh

      - name: Find Gradle project
        run: |
          echo "Searching for gradlew..."
          find . -name "gradlew" -type f -not -path "./.git/*"

      - name: Build APK
        run: |
          GRADLEW=$(find . -name "gradlew" -type f -not -path "./.git/*" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Android project was not generated."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hindustan-tube-pro-debug
          path: "**/build/outputs/apk/**/*.apk"
