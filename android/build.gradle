// Hindustan Tube Pro — Android app module
// Wraps the web app in a Trusted Web Activity (TWA) for native APK / AAB delivery.
plugins {
    id 'com.android.application'
}

android {
    namespace "app.htp.pro"
    compileSdk 35

    defaultConfig {
        applicationId "app.htp.pro"
        minSdk 24                  // Android 7.0
        targetSdk 35
        versionCode 100
        versionName "1.0.0"

        // TWA host (replace with your real domain when you ship)
        manifestPlaceholders = [
            hostName      : System.getenv("HTP_HOST") ?: "hindustantube.pro",
            launcherName  : "Hindustan Tube Pro",
            statusBarColor: "#0F1115",
            splashColor   : "#0F1115"
        ]

        resourceConfigurations += ['en', 'hi', 'ta', 'te', 'bn', 'mr']

        buildConfigField "String", "HOST_NAME", "\"${System.getenv("HTP_HOST") ?: "hindustantube.pro"}\""
    }

    signingConfigs {
        release {
            storeFile     file(System.getenv("HTP_KEYSTORE")  ?: "release.keystore")
            storePassword System.getenv("HTP_KEYSTORE_PWD") ?: "htp-storepass"
            keyAlias      System.getenv("HTP_KEY_ALIAS")     ?: "htp"
            keyPassword   System.getenv("HTP_KEY_PWD")       ?: "htp-keypass"
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled      true
            shrinkResources    true
            signingConfig      signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable          true
        }
    }

    bundle {
        language { enableSplit = true }
        density  { enableSplit = true }
        abi      { enableSplit = true }
    }

    androidResources {
        noCompress 'tflite'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // TWA core — provides the SplashScreen & origin verification helper
    implementation "com.google.androidbrowser:browser:1.8.0"

    // AndroidX core
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.browser:browser:1.8.0'

    // Material 3 components for splash + system UI accents
    implementation 'com.google.android.material:material:1.12.0'

    // Lifecycle aware components
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'

    // Network security configuration to support cleartext for local dev
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
